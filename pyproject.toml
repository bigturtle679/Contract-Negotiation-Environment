[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-negotiation-openenv"
version = "0.1.0"
description = "Contract negotiation environment (OpenEnv-ready)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic==2.6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.50.0",
    "openenv>=0.1.13"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
server = "contract_env.server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contract_env*"]

[tool.pytest.ini_options]
filterwarnings = [
    # FastAPI internally passes 'deprecated' as an extra keyword to pydantic Field().
    # This is a known issue between FastAPI and Pydantic v2 — not our code.
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]