spec_version: 1
name: ContractNegotiationEnv
type: space
runtime: fastapi
app: contract_env.server.app:app
port: 7860

tasks:
  - id: easy_unlimited_liability
    grader: contract_env.env.graders:grade_easy
  - id: medium_auto_renewal
    grader: contract_env.env.graders:grade_medium
  - id: hard_conflicting_obligations
    grader: contract_env.env.graders:grade_hard
  - id: easy_compliance_agreement
    grader: contract_env.env.graders:grade_easy_plus
  - id: hard_intellectual_property
    grader: contract_env.env.graders:grade_hard_plus
  - id: medium_confidentiality_nda
    grader: contract_env.env.graders:grade_medium_plus
  - id: hard_termination_convenience
    grader: contract_env.env.graders:grade_hard_plus2
  - id: expert_data_protection
    grader: contract_env.env.graders:grade_expert

observation_space:
  fields:
    - contract_text
    - clause_type
    - risk_level
    - step_count
    - negotiation_history

action_space:
  type: discrete
  actions:
    - name: FLAG_RISK
      description: Flag a risk without proposing changes. No content required.
    - name: EDIT_CLAUSE
      description: Rewrite the clause with safer language. Requires non-empty content.
    - name: PROPOSE_COUNTER
      description: Submit a formal counter-proposal. Requires non-empty content.
    - name: REJECT
      description: Reject egregiously one-sided terms. No content required.
    - name: ACCEPT
      description: Accept clause when all material risks are resolved. No content required.

reward:
  range: [0.001, 0.999]
