[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-negotiation-openenv"
version = "0.1.0"
description = "Contract negotiation environment (OpenEnv-ready)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
openenv = [
    "openenv @ git+https://github.com/meta-pytorch/OpenEnv.git",
]

[project.scripts]
server = "server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["env*"]
