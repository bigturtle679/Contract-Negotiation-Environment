name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Contract-Negotiation-Environment/contract_env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Contract-Negotiation-Environment/contract_env/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/Contract-Negotiation-Environment/contract_env
        run: python -m unittest discover -s tests -v

      - name: Agent benchmark (heuristic)
        env:
          PYTHONPATH: ${{ github.workspace }}/Contract-Negotiation-Environment/contract_env
        run: python inference.py --benchmark

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: Contract-Negotiation-Environment/contract_env
          push: false
          tags: contract-negotiation-env:ci
