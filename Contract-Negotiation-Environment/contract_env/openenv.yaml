name: ContractNegotiationEnv
entry_point: env.environment:ContractEnv

action_space:
  type: discrete
  values: [FLAG_RISK, EDIT_CLAUSE, ACCEPT, REJECT, PROPOSE_COUNTER]

observation_space:
  fields:
    - contract_text
    - clause_type
    - risk_level
    - step_count
    - negotiation_history
    - task_id
    - task_name
    - done
    - max_steps
    - industry_context

reward:
  range: [0.0, 1.0]
