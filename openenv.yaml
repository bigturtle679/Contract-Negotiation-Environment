name: ContractNegotiationEnv
entry_point: env.environment:ContractEnv

action_space:
  type: discrete
  values: [FLAG_RISK, EDIT_CLAUSE, ACCEPT, REJECT, PROPOSE_COUNTER]

observation_space:
  fields:
    - contract_text
    - clause_type
    - risk_level
    - step_count

reward:
  range: (0.0, 1.0)  # Strictly between 0 and 1, in practice [0.001, 0.999]
